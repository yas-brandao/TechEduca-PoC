<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <title>Login - TechEduca</title>
  <link rel="stylesheet" href="styles/style.css" />
</head>
<body>
  <div class="tema-switch">
    <span>Alterar tema</span>
    <span class="circulo tema-escuro" title="Tema escuro"></span>
    <span class="circulo tema-claro" title="Tema claro"></span>
  </div>
  <h2>Login</h2>
  <form id="loginForm">
    <input type="email" id="email" placeholder="E-mail" required />
    <input type="password" id="password" placeholder="Senha" required />
    <button type="submit">Entrar</button>
  </form>
  <p>Não tem conta? <a href="cadastro.html">Cadastre-se</a></p>

  <script>
    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;

      const res = await fetch("http://localhost:3000/api/auth/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email, password })
      });

      const data = await res.json();
      if (res.ok) {
        alert("Login bem-sucedido!");
        localStorage.setItem("user", JSON.stringify(data.user));
        window.location.href = "cursos.html";
      } else {
        alert(data.error);
      }
    });
  </script>
  
  <!--Alterar tema claro/escuro-->
  <script>
  const root = document.documentElement;
  const darkCircle = document.querySelector('.tema-escuro');
  const lightCircle = document.querySelector('.tema-claro');

  darkCircle.addEventListener('click', () => {
    root.setAttribute('data-theme', 'dark');
  });

  lightCircle.addEventListener('click', () => {
    root.setAttribute('data-theme', 'light');
  });
</script>

</body>
</html>
